<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Графік нарядів</title>
<style>
:root{--bg:#12160f;--card:#1c2318;--card2:#242d1f;--line:#34402c;--txt:#e8ecdf;--mut:#9aa68c;--acc:#9ccc4c;--acc2:#5d8a22;--warn:#e0a83a;--wk:#262214}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{font-size:17px;margin:0}
header .mut{font-size:12px}
main{padding:12px 16px 40px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
select,.btn{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
.btn{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600;margin-top:8px;cursor:pointer}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px;font-size:14px}
.seg button.on{background:var(--acc2);color:#fff}
.day{border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;overflow:hidden}
.day.wk{background:var(--wk)}
.day.today{border-color:var(--acc)}
.dh{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);font-weight:600}
.dh .mut{font-weight:400}
.slot{display:flex;gap:8px;padding:7px 12px;align-items:flex-start}
.slot .t{width:36%;color:var(--mut);font-size:13px;padding-top:4px}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.chip.me{background:var(--acc2);color:#fff}
.chip .tm{display:block;font-size:11px;opacity:.75}
.next{border-color:var(--acc)}
.big{font-size:21px;font-weight:700;margin:4px 0}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.warn{background:#3a2c12;border:1px solid var(--warn);color:#f3d79a;border-radius:10px;padding:10px;font-size:14px}
</style>
</head>
<body>
<header><h1 id="ttl">Графік нарядів</h1><div class="mut" id="sub"></div></header>
<main id="v"><div class="card mut">Завантаження…</div></main>
<script>
'use strict';
var DOW = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
var MG = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
var B62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
var CODE_RE = /NARYAD([12])([zj]):([A-Za-z0-9_\-]+)/;
var LS = 'naryadyWeb';
var O, T = {}, P = {}, A = {}, me = '', mode = 'mine', CUR = '';
function pad(n){return (n<10?'0':'')+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function today(){return ds(new Date())}
function dow(s){return pd(s).getDay()}
function fmtD(s){var d=pd(s);return d.getDate()+' '+MG[d.getMonth()]}
function fmtShort(s){var d=pd(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)}
function fmtStamp(ms){var d=new Date(ms);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function hm(x){return pad(x.getHours())+':'+pad(x.getMinutes())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k){try{return localStorage.getItem(LS+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,v)}catch(e){}}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';var bin=atob(str),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function inflate(bytes){return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(ab){return new Uint8Array(ab)})}
function decode(text){
  var m=CODE_RE.exec(text||'');if(!m)return Promise.reject(new Error('nocode'));
  var bytes=unb64u(m[3]);
  var p=m[2]==='z'?(window.DecompressionStream?inflate(bytes):Promise.reject(new Error('old'))):Promise.resolve(bytes);
  return p.then(function(b){
    var o=JSON.parse(new TextDecoder().decode(b));
    if(o.v===2&&o.G){var D={};o.T.forEach(function(t,ti){var str=o.G[ti]||'',pos=0,w=o.w||1;for(var di=0;di<o.n;di++){var d=addDays(o.b,di);for(var s=0;s<t[4];s++){var c=str.substr(pos,w);pos+=w;if(!c||c.charAt(0)==='.')continue;var idx=w===1?B62.indexOf(c):B62.indexOf(c[0])*62+B62.indexOf(c[1]);if(o.P[idx])(D[d]=D[d]||[]).push(t[0]+'.'+s+'.'+o.P[idx][0])}}});o.D=D}
    return o;
  });
}
function isSplit(t){return !!t.split&&t.perDay>1}
function slotTimes(t,d,slot){var a=(t.start||'08:00').split(':'),st=pd(d);st.setHours(+a[0]||0,+a[1]||0,0,0);var len=(+t.hours||24)/(isSplit(t)?t.perDay:1)*36e5;if(isSplit(t))st=new Date(st.getTime()+(slot||0)*len);return{start:st,end:new Date(st.getTime()+len)}}
function span(t,d,slot){var r=slotTimes(t,d,slot),sd=ds(r.start),ed=ds(r.end);return 'з '+hm(r.start)+(sd!==d?' ('+fmtShort(sd)+')':'')+' по '+hm(r.end)+(ed!==sd?' ('+fmtShort(ed)+')':'')}
function pname(p){return p?((p.rank?p.rank+' ':'')+p.name):'—'}
function load(o){
  O=o;T={};P={};A={};
  o.T.forEach(function(t){T[t[0]]={id:t[0],name:t[1],start:t[2],hours:t[3],perDay:t[4],days:t[5],split:!!t[6]}});
  o.P.forEach(function(p){P[p[0]]={id:p[0],rank:p[1],name:p[2]}});
  Object.keys(o.D).forEach(function(d){o.D[d].forEach(function(e){var x=e.split('.');A[d+'|'+x[0]+'|'+x[1]]=x.slice(2).join('.')})});
  me=lsGet('me')||'';if(!P[me])me='';
}
function myList(){var r=[];for(var k in A){if(A[k]!==me)continue;var q=k.split('|'),t=T[q[1]];if(t)r.push({date:q[0],t:t,slot:+q[2],st:slotTimes(t,q[0],+q[2])})}return r.sort(function(a,b){return a.st.start-b.st.start})}
function remLabel(){return (O.R||[60,10]).map(function(m){return m>=60&&m%60===0?(m/60)+' год':m+' хв'}).join(' і за ')}
function render(){
  var v=document.getElementById('v');
  document.getElementById('ttl').textContent='Графік нарядів'+(O.u?' · '+O.u:'');
  document.getElementById('sub').textContent='Оновлено командиром: '+fmtStamp(O.s);
  var h='';
  if(/Android/i.test(navigator.userAgent)&&CUR){
    var fb=encodeURIComponent(location.href.split('#')[0]+'#'+CUR);
    h+='<div class="card next"><h3>📲 Є застосунок «Наряди · Боєць»?</h3><div class="mut">Відкрийте графік у застосунку — нагадування встановляться автоматично.</div><a class="btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" href="intent://import?c='+CUR+'#Intent;scheme=naryad;package=ua.mil.naryady;S.browser_fallback_url='+fb+';end">Відкрити в застосунку</a></div>';
  }
  h+='<div class="card"><h3>Хто ви?</h3><select id="who"><option value="">— оберіть себе —</option>'+
    Object.keys(P).map(function(k){return P[k]}).sort(function(a,b){return a.name.localeCompare(b.name,'uk')}).map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===me?' selected':'')+'>'+esc(pname(p))+'</option>'}).join('')+'</select></div>';
  h+='<div class="seg"><button data-m="mine" class="'+(mode==='mine'?'on':'')+'">Мої наряди</button><button data-m="all" class="'+(mode==='all'?'on':'')+'">Увесь графік</button></div>';
  if(mode==='mine'){
    if(!me)h+='<div class="card mut">Оберіть себе у списку вище, щоб побачити свої наряди.</div>';
    else{
      var now=new Date(),list=myList(),fut=list.filter(function(x){return x.st.end>now});
      if(fut.length){
        var n=fut[0],dd=Math.round((pd(n.date)-pd(today()))/864e5),when=dd===0?'Сьогодні':dd===1?'Завтра':'Через '+dd+' дн.';
        h+='<div class="card next"><div class="mut">Найближчий наряд</div><div class="big">'+when+', '+fmtD(n.date)+'</div><div>'+esc(n.t.name)+' · '+DOW[dow(n.date)]+'</div><div style="font-size:17px;font-weight:600;margin-top:4px">🕗 '+esc(span(n.t,n.date,n.slot))+'</div></div>';
        h+='<div class="card"><h3>Усі мої наряди</h3>'+fut.map(function(x){return '<div class="li"><div>'+fmtD(x.date)+' <span class="mut">'+DOW[dow(x.date)]+'</span><div class="mut">'+esc(x.t.name)+'</div></div><div class="mut" style="text-align:right">'+esc(span(x.t,x.date,x.slot))+'</div></div>'}).join('')+'</div>';
        h+='<div class="card"><h3>📅 Нагадування на iPhone / в календарі</h3><div class="mut">Додайте свої наряди в календар телефону — він нагадає за '+remLabel()+' до початку.</div><button class="btn" id="ics">Додати мої наряди в календар</button></div>';
      } else h+='<div class="card mut">Запланованих нарядів немає 👍</div>';
    }
  } else {
    var t0=today(),days=Object.keys(O.D).sort().filter(function(d){return d>=addDays(t0,-1)});
    days.forEach(function(d){
      var rows='';
      Object.keys(T).forEach(function(tid){var t=T[tid],chips='';for(var s=0;s<t.perDay;s++){var pid=A[d+'|'+tid+'|'+s];if(!pid)continue;chips+='<span class="chip'+(pid===me?' me':'')+'">'+esc(pname(P[pid]))+'<span class="tm">'+esc(span(t,d,s))+'</span></span>'}if(chips)rows+='<div class="slot"><div class="t">'+esc(t.name)+'</div><div class="chips">'+chips+'</div></div>'});
      if(rows)h+='<div class="day'+(dow(d)%6===0?' wk':'')+(d===t0?' today':'')+'"><div class="dh"><span>'+fmtD(d)+'</span><span class="mut">'+DOW[dow(d)]+(d===t0?' · сьогодні':'')+'</span></div>'+rows+'</div>';
    });
  }
  h+='<p class="mut" style="text-align:center">Дані графіка містяться в самому посиланні й не передаються на сервер. Є Android? Встановіть застосунок «Наряди · Боєць» — нагадування прийдуть автоматично.</p>';
  v.innerHTML=h;
  document.getElementById('who').onchange=function(){me=this.value;lsSet('me',me);render()};
  Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(b){b.onclick=function(){mode=b.dataset.m;render()}});
  var ib=document.getElementById('ics');if(ib)ib.onclick=downloadIcs;
}
function icsDate(d){return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'}
function icsEsc(s){return String(s).replace(/[\\,;]/g,function(c){return '\\'+c}).replace(/\n/g,'\\n')}
function downloadIcs(){
  var now=new Date(),list=myList().filter(function(x){return x.st.end>now}),stamp=icsDate(now);
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Naryady//UA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Наряди'];
  list.forEach(function(x){
    L.push('BEGIN:VEVENT','UID:naryad-'+x.date+'-'+x.t.id+'-'+x.slot+'-'+me+'@naryady','DTSTAMP:'+stamp,'DTSTART:'+icsDate(x.st.start),'DTEND:'+icsDate(x.st.end),'SUMMARY:'+icsEsc('Наряд: '+x.t.name),'DESCRIPTION:'+icsEsc(pname(P[me])+' — '+span(x.t,x.date,x.slot)));
    (O.R||[60,10]).forEach(function(m){L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Наряд: '+x.t.name),'TRIGGER:-PT'+m+'M','END:VALARM')});
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  var blob=new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='naryady.ics';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000);
}
function fail(msg){document.getElementById('v').innerHTML='<div class="warn">'+msg+'</div>'}
(function(){
  var h=decodeURIComponent(location.hash.slice(1)||''),saved=lsGet('code')||'';
  var src=CODE_RE.test(h)?h:saved;
  if(!src){fail('Відкрийте посилання з графіком, яке командир надіслав у WhatsApp.');return}
  decode(src).then(function(o){
    if(src!==saved){
      var prev=0;try{prev=JSON.parse(lsGet('ver')||'0')}catch(e){}
      if(o.s>=prev){lsSet('code',src);lsSet('ver',JSON.stringify(o.s))}
    }
    CUR=(CODE_RE.exec(src)||[''])[0];load(o);render();
  }).catch(function(e){fail(e.message==='old'?'Браузер застарілий. Оновіть його (iOS 16.4+ / Chrome 80+).':'Посилання пошкоджене. Попросіть командира надіслати графік знову.')});
})();
</script>
</body>
</html>
