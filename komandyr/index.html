<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Наряди · Командир</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#12160f;--card:#1c2318;--card2:#242d1f;--line:#34402c;--txt:#e8ecdf;--mut:#9aa68c;--acc:#9ccc4c;--acc2:#5d8a22;--warn:#e0a83a;--bad:#e05a4a;--wk:#262214}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px}
.btn.p{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
.btn.d{color:var(--bad)}
.btn.s{padding:6px 10px;font-size:13px}
.btn.w{width:100%}
.btn:active{opacity:.7}
input,select,textarea{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;font-family:inherit}
input[type=checkbox]{width:auto;transform:scale(1.25);margin:0 4px}
label.f{display:block;font-size:12px;color:var(--mut);margin:9px 0 3px}
.mut{color:var(--mut);font-size:13px}
.day{border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;overflow:hidden}
.day.wk{background:var(--wk)}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day.past{opacity:.55}
.dh{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);font-weight:600}
.dh .mut{font-weight:400}
.tplb{padding:2px 8px;font-size:12px;margin-left:6px;vertical-align:middle}
.slot{display:flex;gap:8px;padding:7px 12px;align-items:flex-start}
.slot .t{width:36%;color:var(--mut);font-size:13px;padding-top:4px}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:14px;cursor:pointer}
.chip .tm{display:block;font-size:11px;opacity:.75;margin-top:1px}
.chip{border-radius:10px}
.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--acc2);color:#fff;box-shadow:0 6px 18px #000a;transform:scale(1.08)}
.chip.dragsrc{opacity:.35}
.chip.dropto{outline:2px solid var(--warn);background:#4a3a14}
body.dragging{overscroll-behavior:none}
.chip.m{border-color:var(--acc)}
.chip.e{color:var(--bad);border-style:dashed}
.chip.me{background:var(--acc2);color:#fff}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--card2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.tag.a{color:var(--warn);border-color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:90%;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.warnbox{background:#3a2c12;border:1px solid var(--warn);color:#f3d79a;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.dows{display:flex;gap:4px}
.dows span{flex:1;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:13px;cursor:pointer}
.dows span.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px;font-size:13px}
.seg button.on{background:var(--acc2);color:#fff}
.cand{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cand.no{opacity:.45}
</style>
</head>
<body>
<header><h1 id="title">Графік нарядів</h1></header>
<main id="view"></main>
<nav id="nav">
  <button data-t="sched" class="on"><span class="i">📅</span>Графік</button>
  <button data-t="people"><span class="i">👥</span>Склад</button>
  <button data-t="types"><span class="i">🛡️</span>Наряди</button>
  <button data-t="stats"><span class="i">📊</span>Статистика</button>
  <button data-t="settings"><span class="i">⚙️</span>Налашт.</button>
</nav>

<script src="js/mode.js?v=1.8.0"></script>
<script src="js/app.js?v=1.8.0"></script>
</body>
</html>
